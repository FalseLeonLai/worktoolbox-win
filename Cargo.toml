[package]
name = "worktoolbox-win"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "file", "webp"] }
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# 发布版：体积优化（配合 Windows 交叉编译出小体积 exe）
[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
